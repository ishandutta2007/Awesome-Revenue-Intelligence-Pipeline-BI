<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card/Pill Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #f8fafc;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
    }

    /* CSS Animations for Background Elements Only */
    @keyframes floatLight {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .anim-float { animation: floatLight 6s ease-in-out infinite; }
    .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .anim-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="336" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Dynamic Animated Background Mesh / Orbs (Kept behind foreground text) -->
  <g class="anim-pulse" opacity="0.6">
    <circle cx="150" cy="80" r="180" fill="url(#cyanGlow)" filter="blur(40px)"/>
    <circle cx="1050" cy="260" r="200" fill="url(#purpleGlow)" filter="blur(50px)"/>
  </g>

  <!-- Decorative Animated Grid/Flow Lines in Background -->
  <g opacity="0.25" class="anim-dash">
    <path d="M 50,280 Q 300,160 600,240 T 1150,100" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 50,100 Q 400,290 800,150 T 1150,260" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Foreground Content Area (Clean & High Contrast) -->
  <g transform="translate(60, 0)">
    
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 50)">
      <rect width="280" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
      <text x="32" y="22" class="badge-text">REVENUE INTELLIGENCE &amp; BI</text>
    </g>

    <!-- Main Title & Subtitle (Always in Crisp Foreground) -->
    <text x="0" y="142" class="title">Awesome Revenue Intelligence &amp; Pipeline BI</text>
    <text x="0" y="182" class="subtitle">Top Open-Source &amp; Commercial Solutions for Deal Risk, Forecasting &amp; RevOps</text>

    <!-- Analytics Dashboard Cards (Floating Decorative Elements at Bottom) -->
    <g transform="translate(0, 215)">
      <!-- Card 1: Pipeline Health -->
      <g class="anim-float" style="animation-delay: 0s;">
        <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#shadow)"/>
        <text x="18" y="32" class="stat-val">📊 94.2%</text>
        <text x="18" y="52" class="stat-label">Forecast Accuracy Score</text>
      </g>

      <!-- Card 2: Leakage Detected -->
      <g transform="translate(240, 0)" class="anim-float" style="animation-delay: 1s;">
        <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#shadow)"/>
        <text x="18" y="32" class="stat-val">🔍 Stall &amp; Leakage</text>
        <text x="18" y="52" class="stat-label">Automated Deal Risk Radar</text>
      </g>

      <!-- Card 3: NRR & Cohort BI -->
      <g transform="translate(480, 0)" class="anim-float" style="animation-delay: 2s;">
        <rect width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#shadow)"/>
        <text x="18" y="32" class="stat-val">🚀 Open &amp; Self-Hosted</text>
        <text x="18" y="52" class="stat-label">CRM Analytics &amp; Local AI</text>
      </g>
    </g>

  </g>
</svg>
